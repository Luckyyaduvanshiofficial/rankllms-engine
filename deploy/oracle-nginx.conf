server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # This block previously used `alias /app/staticfiles/`, which is a path
    # inside the container. This nginx runs on the host, so the alias never
    # resolved and every static file 404'd. Static files are now served by
    # WhiteNoise inside gunicorn with fingerprinted names, so proxy them
    # through and let the long cache header apply.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
