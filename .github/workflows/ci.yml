name: Django checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,::1,api.rankllms.com,rankllms-engine-kqso.onrender.com
      CORS_ALLOWED_ORIGINS: https://rankllms.com,https://www.rankllms.com,https://api.rankllms.com
      CSRF_TRUSTED_ORIGINS: https://api.rankllms.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
