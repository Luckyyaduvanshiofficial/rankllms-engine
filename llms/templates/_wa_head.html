{# Web Awesome CDN + RankLLMs brand tokens. Include early in <head> (after charset). #}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <!-- RankLLMs fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Web Awesome 3.13.0 CDN: theme + loader + utilities + native reset -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.13.0/styles/webawesome.css">
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.13.0/webawesome.loader.js"></script>

  <script>
    /* FOUCE: apply saved color scheme before first paint */
    (function () {
      try {
        var s = localStorage.getItem('rankllms-scheme');
        var dark = s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('wa-dark', dark);
        document.documentElement.classList.toggle('wa-light', !dark);
      } catch (e) {
        document.documentElement.classList.add('wa-light');
      }
    })();
  </script>

  <script>
    /* Theme toggle: inject into every page header, persist to localStorage */
    document.addEventListener('DOMContentLoaded', function () {
      var isDark = document.documentElement.classList.contains('wa-dark');
      var btn = document.createElement('wa-button');
      btn.setAttribute('appearance', 'plain');
      btn.setAttribute('size', 's');
      btn.setAttribute('class', 'theme-toggle');
      btn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      btn.setAttribute('title', isDark ? 'Light mode' : 'Dark mode');
      btn.innerHTML = '<wa-icon name="' + (isDark ? 'sun' : 'moon') + '"></wa-icon>';
      btn.addEventListener('click', function () {
        var dark = !document.documentElement.classList.contains('wa-dark');
        document.documentElement.classList.toggle('wa-dark', dark);
        document.documentElement.classList.toggle('wa-light', !dark);
        try { localStorage.setItem('rankllms-scheme', dark ? 'dark' : 'light'); } catch (e) {}
        btn.querySelector('wa-icon').setAttribute('name', dark ? 'sun' : 'moon');
        btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        btn.setAttribute('title', dark ? 'Light mode' : 'Dark mode');
      });
      var actions = document.querySelector('.header-actions');
      if (actions) {
        actions.insertBefore(btn, actions.firstChild);
      } else {
        var header = document.querySelector('header.site-header, .site-header');
        if (header) {
          var menu = header.querySelector('.toggle-nav');
          if (menu) header.insertBefore(btn, menu);
          else header.appendChild(btn);
        }
      }
    });
  </script>

  <style>
    html,
    body {
      min-height: 100%;
      padding: 0;
      margin: 0;
    }

    :root {
      /* RankLLMs brand → WA semantic brand tokens */
      --wa-color-brand-fill-loud: #cc785c;
      --wa-color-brand-fill-normal: #cc785c;
      --wa-color-brand-fill-quiet: #f6e7e1;
      --wa-color-brand-on-loud: #ffffff;
      --wa-color-brand-on-normal: #181715;
      --wa-color-brand-on-quiet: #9a4a32;
      --wa-color-brand-border-normal: #cc785c;
      --wa-color-brand-border-quiet: #e8b8a8;

      /* RankLLMs canvas / ink / muted */
      --wa-color-surface-default: #faf9f5;
      --wa-color-surface-raised: #ffffff;
      --wa-color-surface-lowered: #f3f1eb;
      --wa-color-surface-border: #e8e5dc;
      --wa-color-text-normal: #181715;
      --wa-color-text-quiet: #6e6c64;
      --wa-color-text-link: #b8664b;

      --wa-font-family-display: "Newsreader", Georgia, serif;
      --wa-font-family-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --wa-font-family-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .wa-dark {
      --wa-color-surface-default: #141413;
      --wa-color-surface-raised: #181715;
      --wa-color-surface-lowered: #100f0e;
      --wa-color-surface-border: #302f2c;
      --wa-color-text-normal: #f2f0e8;
      --wa-color-text-quiet: #8d8a80;
      --wa-color-text-link: #e8b8a8;
      --wa-color-brand-on-quiet: #e8b8a8;
      --wa-color-brand-fill-quiet: #2a221e;
    }

    body {
      font-family: var(--wa-font-family-body);
      background: var(--wa-color-surface-default);
      color: var(--wa-color-text-normal);
    }

    main {
      padding: 0;
    }

    .section {
      padding-inline: var(--wa-space-xl);
    }

    .brand-wordmark {
      font-family: var(--wa-font-family-display);
      font-size: var(--wa-font-size-2xl);
      letter-spacing: -0.02em;
      color: var(--wa-color-text-normal);
      text-decoration: none;
      font-weight: 500;
    }

    .brand-wordmark:hover {
      color: var(--wa-color-brand-fill-normal);
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--wa-space-m);
      padding-block: var(--wa-space-m);
      border-bottom: 1px solid var(--wa-color-surface-border);
    }

    .header-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--wa-space-2xs);
    }

    .header-nav wa-button.is-active {
      --wa-button-background-color: var(--wa-color-brand-fill-quiet);
      --wa-button-color: var(--wa-color-brand-on-quiet);
    }

    /* Header-on-desktop / drawer-on-mobile recipe (wa-page dual-nav) */
    wa-page[view='mobile'] .header-nav {
      display: none;
    }

    wa-page[view='desktop']::part(navigation) {
      display: none;
    }

    .content-wrap {
      max-width: 72rem;
      margin-inline: auto;
      width: 100%;
    }

    .hero {
      text-align: center;
      padding-block: var(--wa-space-3xl) var(--wa-space-2xl);
    }

    .hero h1 {
      font-family: var(--wa-font-family-display);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0;
      font-weight: 500;
    }

    .hero p {
      color: var(--wa-color-text-quiet);
      font-size: var(--wa-font-size-l);
      max-width: 40rem;
      margin: var(--wa-space-m) auto var(--wa-space-l);
      line-height: 1.6;
    }

    .hero-actions {
      justify-content: center;
    }

    .section-block {

    }

    .section-block > h2 {

      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0 0 var(--wa-space-2xs);
      font-size: var(--wa-font-size-xl);
    }

    .section-block > .lede {

      margin: 0 0 var(--wa-space-l);
      max-width: 48rem;
      line-height: 1.6;

    .feature-card h3 {
      margin: 0;
      font-size: var(--wa-font-size-m);
      font-family: var(--wa-font-family-body);
      font-weight: 600;
    }

    .feature-card p {
      margin: 0;
      color: var(--wa-color-text-quiet);
      font-size: var(--wa-font-size-s);
      line-height: 1.55;
    }

    .feature-card .card-link {
      font-weight: 600;
      font-size: var(--wa-font-size-s);
      color: var(--wa-color-text-link);
      text-decoration: none;

    }

    .source-card {
      height: 100%;
    }

    .source-card h3 {

      font-size: var(--wa-font-size-m);
      font-weight: 600;
    }

    .source-card p {
      margin: 0;
      color: var(--wa-color-text-quiet);
      font-size: var(--wa-font-size-s);
      line-height: 1.55;
      flex: 1;
    }

    .source-card .card-links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--wa-space-2xs);
    }

    .flow-card {
      text-align: center;
    }

    .flow-card h2 {
      font-family: var(--wa-font-family-display);
      font-weight: 500;
      margin: 0 0 var(--wa-space-m);
      font-size: var(--wa-font-size-l);
    }

    .flow-steps {

      flex-wrap: wrap;
      align-items: center;
      justify-content: center;

      font-size: var(--wa-font-size-2xs);

    .flow-step {

      border: 1px solid var(--wa-color-surface-border);

    }

    .flow-arrow {

    }

    .endpoint-list {
      display: flex;
      flex-direction: column;
      gap: var(--wa-space-2xs);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .endpoint {

      align-items: center;
      gap: var(--wa-space-s);
      flex-wrap: wrap;
      padding: var(--wa-space-s);
      background: var(--wa-color-surface-lowered);
      border: 1px solid var(--wa-color-surface-border);
      border-radius: var(--wa-border-radius-m);

    .endpoint code {

      font-size: var(--wa-font-size-2xs);
      background: var(--wa-color-surface-raised);
      border: 1px solid var(--wa-color-surface-border);
      padding: 0.1rem 0.4rem;
      border-radius: var(--wa-border-radius-s);
    }

    .endpoint span:last-child {
      color: var(--wa-color-text-quiet);
      font-size: var(--wa-font-size-s);
      margin-inline-start: auto;
    }

    .credits-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: var(--wa-space-2xs);
    }

    .credits-list li {
      font-size: var(--wa-font-size-s);
      color: var(--wa-color-text-quiet);
      padding-left: var(--wa-space-m);
      position: relative;
      line-height: 1.5;
    }

    .credits-list li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: var(--wa-color-text-quiet);
    }

    .credits-list a {
      color: var(--wa-color-text-link);
      font-weight: 600;
    }

    .site-footer {
      border-top: 1px solid var(--wa-color-surface-border);
      padding-block: var(--wa-space-l);
      text-align: center;
      color: var(--wa-color-text-quiet);
      font-size: var(--wa-font-size-s);
      display: flex;
      flex-direction: column;
      gap: var(--wa-space-2xs);
      align-items: center;
    }

    .site-footer p {
      margin: 0;
    }

    .site-footer a {
      color: var(--wa-color-text-link);
    }

    .toggle-nav {
      display: none;
    }

    wa-page[view='mobile'] .toggle-nav {
      display: inline-flex;
    }

    /* Page header (title + meta + controls) */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: var(--wa-space-m);
      padding-bottom: var(--wa-space-m);
      border-bottom: 1px solid var(--wa-color-surface-border);
    }

    .page-header h1 {
      font-family: var(--wa-font-family-display);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0;
      font-size: var(--wa-font-size-2xl);
    }

    .page-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--wa-space-s);
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
      color: var(--wa-color-text-quiet);
      margin-top: var(--wa-space-2xs);
    }

    .page-meta strong {
      color: var(--wa-color-text-normal);
    }

    .page-meta a {
      color: var(--wa-color-text-link);
      text-decoration: none;
    }

    .page-meta a:hover {
      text-decoration: underline;
    }

    .page-lede {

      font-size: var(--wa-font-size-s);
      max-width: 40rem;
      margin: var(--wa-space-2xs) 0 0;
      line-height: 1.55;
    }

    .page-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--wa-space-s);
    }

    .page-controls wa-input,
    .page-controls wa-select {

    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: var(--wa-space-2xs);
      margin-top: var(--wa-space-s);
    }

    /* Semantic HTML tables (no wa-table on free tier) */
    .lb-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--wa-color-surface-border);
      border-radius: var(--wa-border-radius-l);
      background: var(--wa-color-surface-raised);
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--wa-font-size-s);
      text-align: left;
      white-space: nowrap;
    }

    .lb-table th {
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--wa-color-text-quiet);
      background: var(--wa-color-surface-lowered);
      padding: var(--wa-space-s) var(--wa-space-m);
      border-bottom: 1px solid var(--wa-color-surface-border);
      user-select: none;
    }

    .lb-table td {
      padding: var(--wa-space-s) var(--wa-space-m);
      border-bottom: 1px solid var(--wa-color-surface-border);
      color: var(--wa-color-text-normal);
      vertical-align: middle;
    }

    .lb-table tbody tr:last-child td {
      border-bottom: none;
    }

    .lb-table tbody tr:hover td {
      background: var(--wa-color-surface-lowered);
    }

    .lb-table .num {
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
      text-align: center;
    }

    .lb-table .score {
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
      text-align: center;
      font-weight: 600;
    }

    .lb-table .model-cell {
      font-weight: 500;
    }

    .lb-table .model-cell .slug {
      display: block;
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-3xs);
      color: var(--wa-color-text-quiet);
      font-weight: 400;

    }

    .lb-table .provider {

      font-size: var(--wa-font-size-2xs);
    }

    .lb-rank.rank-1 { color: #d97706; }
    .lb-rank.rank-2 { color: #6e6c64; }

    .lb-medal {

      height: 1.75rem;

      font-size: var(--wa-font-size-3xs);

      color: var(--wa-color-text-quiet);
    }

    .lb-medal.medal-1 {

    }

    .lb-medal.medal-2 {

      color: #374151;
    }

    .lb-medal.medal-3 {
      background: #ffedd5;
      color: #c2410c;
    }

    .wa-dark .lb-medal.medal-1 {
      background: #451a03;
      color: #fbbf24;
    }

    .wa-dark .lb-medal.medal-2 {
      background: #1f2937;
      color: #d1d5db;
    }

    .wa-dark .lb-medal.medal-3 {
      background: #431407;
      color: #fb923c;
    }

    .score-index {

      font-weight: 700;
      font-size: var(--wa-font-size-xs);
    }

    .score-code {
      color: #3b7a57;
      font-weight: 600;
    }

    .wa-dark .score-code {
      color: #6ee7a0;
    }

    .price-free {
      color: #3b7a57;
      font-weight: 600;
    }

    .wa-dark .price-free {
      color: #6ee7a0;
    }

    .loading-row {
      text-align: center;
      padding: var(--wa-space-2xl) var(--wa-space-m) !important;
      color: var(--wa-color-text-quiet);
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
    }

    .loading-row.is-error {
      color: var(--wa-color-danger-fill-normal, #dc2626);
    }

    .table-empty {
      text-align: center;
      padding: var(--wa-space-2xl) var(--wa-space-m) !important;
      color: var(--wa-color-text-quiet);
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
    }

    /* Controls card / API footnote */
    .controls-card {
      padding: var(--wa-space-m);
    }

    .api-note {
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
      color: var(--wa-color-text-quiet);
      line-height: 1.7;

    }

    .api-note code {

      border: 1px solid var(--wa-color-surface-border);
      padding: 0.1rem 0.35rem;
      border-radius: var(--wa-border-radius-s);
      color: var(--wa-color-text-normal);
    }

    .api-note a {
      color: var(--wa-color-text-link);
      font-weight: 600;
    }

    /* Catalog page header actions (refresh + API link) */
    .page-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--wa-space-s);
      align-items: center;
    }

    .api-link-btn {
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-2xs);
    }

    .brand-badge {
      margin-inline-start: var(--wa-space-xs);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--wa-space-s);
    }

    .theme-toggle wa-icon {
      font-size: var(--wa-font-size-m);
    }

    .wa-dark .site-header {
      background: transparent;
    }

    /* Sortable table headers */
    .lb-table th.sortable {
      cursor: pointer;
    }

    .lb-table th.sortable:hover {
      color: var(--wa-color-text-normal);
    }

    .lb-table th .sort-ind {
      display: inline-block;
      margin-inline-start: 0.25rem;
      color: var(--wa-color-text-quiet);
      font-weight: 400;
    }

    .lb-table th .sort-ind.is-active {
      color: var(--wa-color-brand-fill-normal);
      font-weight: 700;
    }

      display: inline-flex;
      align-items: center;
      gap: 0.25rem;

    .th-inner.center {
      justify-content: center;
      width: 100%;
    }

    .th-inner.end {
      justify-content: flex-end;
      width: 100%;
    }

    /* Filter / preset pills row */
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: var(--wa-space-2xs);
    }

    /* Sort direction toggle */
    .sort-dir-btn {
      min-width: 9rem;
      justify-content: center;
    }

    /* Compact footer columns (site-footer multi-col) */
    .footer-cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: var(--wa-space-l);
      text-align: start;
      width: 100%;
      padding-bottom: var(--wa-space-l);
      border-bottom: 1px solid var(--wa-color-surface-border);
      margin-bottom: var(--wa-space-m);
    }

    .footer-cols .col-title {
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-3xs);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--wa-color-text-quiet);
      font-weight: 600;
      margin: 0 0 var(--wa-space-s);
    }

    .footer-cols ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: var(--wa-space-2xs);
    }

    .footer-cols a {
      color: var(--wa-color-text-normal);
      text-decoration: none;
      font-size: var(--wa-font-size-s);
    }

    .footer-cols a:hover {
      color: var(--wa-color-text-link);
    }

    .footer-cols a.is-active {
      color: var(--wa-color-brand-fill-normal);
      font-weight: 600;
    }

    .footer-cols .col-blurb {
      color: var(--wa-color-text-quiet);
      font-size: var(--wa-font-size-s);
      line-height: 1.55;
      margin: 0;
    }

    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: var(--wa-space-s);
      font-family: var(--wa-font-family-mono);
      font-size: var(--wa-font-size-3xs);
