<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Model Benchmarks — GPQA, SWE-bench, Intelligence Indices | RankLLMs</title>
  <meta name="description" content="Free AI benchmark matrix: OpenRouter, Design Arena, and Artificial Analysis scores including GPQA, SWE-bench, intelligence and coding indices.">
  <meta name="keywords" content="AI benchmarks, SWE-bench, GPQA, intelligence index, coding index, LLM evaluation">
  <link rel="canonical" href="https://api.rankllms.com/benchmarks">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI Model Benchmarks | RankLLMs">
  <meta property="og:description" content="Unified benchmark evaluations for AI models: intelligence, coding, GPQA, SWE-bench, and more.">
  <meta property="og:url" content="https://api.rankllms.com/benchmarks">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AI Model Benchmarks | RankLLMs">
  <meta name="twitter:description" content="Unified benchmark evaluations for AI models: intelligence, coding, GPQA, SWE-bench, and more.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #fafafa; }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #eee; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #1a1a1a; text-decoration: none; }
    nav a { margin-left: 1.5rem; color: #666; text-decoration: none; font-size: 0.9rem; }
    nav a:hover { color: #1a1a1a; }
    nav a.active { color: #1a1a1a; font-weight: 600; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
    h1 { font-size: 1.5rem; }
    .filters { display: flex; gap: 0.5rem; align-items: center; }
    .filters select { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; }
    #loading { text-align: center; padding: 2rem; color: #666; }
    table { width: 100%; background: white; border-radius: 8px; border: 1px solid #eee; overflow: hidden; }
    th { text-align: left; padding: 0.75rem 1rem; background: #f9f9f9; font-size: 0.75rem; font-weight: 600; color: #666; text-transform: uppercase; border-bottom: 1px solid #eee; }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid #f3f3f3; font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #fafafa; }
    .rank { font-weight: 700; }
    .score { font-family: 'Monaco', 'Menlo', monospace; font-size: 0.8rem; }
    .source { display: inline-block; padding: 0.15rem 0.4rem; font-size: 0.65rem; border-radius: 3px; }
    .source-openrouter { background: #fef3c7; color: #92400e; }
    .source-design { background: #dbeafe; color: #1e40af; }
    .source-artificial { background: #d1fae5; color: #065f46; }
    footer { text-align: center; padding: 2rem 0; color: #999; font-size: 0.8rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="logo">RankLLMs</a>
      <nav>
        <a href="/">Home</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/benchmarks" class="active">Benchmarks</a>
        <a href="/api/v1/docs" target="_blank">API</a>
      </nav>
    </header>

    <div class="page-header">
      <h1>Model Benchmark Evaluations</h1>
      <div class="filters">
        <select id="source" onchange="loadBenchmarks()">
          <option value="all">All Sources</option>
          <option value="openrouter">OpenRouter</option>
          <option value="design-arena">Design Arena</option>
          <option value="artificial-analysis">Artificial Analysis</option>
        </select>
        <select id="sortBy" onchange="loadBenchmarks()">
          <option value="score">Score</option>
          <option value="accuracy">Accuracy</option>
          <option value="elo">ELO</option>
          <option value="intelligence">Intelligence</option>
          <option value="coding">Coding</option>
        </select>
      </div>
    </div>

    <div id="loading">Loading benchmark data...</div>
    <table id="benchmarks" style="display: none;">
      <thead>
        <tr>
          <th style="width: 50px;">#</th>
          <th>Model</th>
          <th>Source</th>
          <th>Type</th>
          <th>Accuracy</th>
          <th>ELO</th>
          <th>Intelligence</th>
          <th>Coding</th>
        </tr>
      </thead>
      <tbody id="benchmarks-body"></tbody>
    </table>

    <footer>
      <p>RankLLMs Engine &copy; 2026 &middot; Data from <a href="https://openrouter.ai" rel="noopener">OpenRouter</a>, <a href="https://artificialanalysis.ai" rel="noopener">Artificial Analysis</a> &amp; <a href="https://models.dev" rel="noopener">models.dev</a></p>
      <p><a href="https://rankllms.com" rel="noopener">rankllms.com</a> &middot; Built by <a href="https://codaipro.com" rel="noopener">CodaiPro</a></p>
    </footer>
  </div>

  <script>
    async function loadBenchmarks() {
      const source = document.getElementById('source').value;
      const sortBy = document.getElementById('sortBy').value;
      const loading = document.getElementById('loading');
      const table = document.getElementById('benchmarks');
      const tbody = document.getElementById('benchmarks-body');

      loading.style.display = 'block';
      table.style.display = 'none';

      try {
        const url = `/api/v1/benchmarks/openrouter?source=${source}&sort_by=${sortBy}&limit=100`;
        const res = await fetch(url);
        const data = await res.json();

        tbody.innerHTML = '';

        for (let i = 0; i < (data.items || []).length; i++) {
          const item = data.items[i];
          const row = document.createElement('tr');

          let sourceClass = '';
          if (item.source === 'openrouter') sourceClass = 'source-openrouter';
          else if (item.source === 'design-arena') sourceClass = 'source-design';
          else if (item.source === 'artificial-analysis') sourceClass = 'source-artificial';

          row.innerHTML = `
            <td class="rank">${i + 1}</td>
            <td>${item.display_name || item.model_permaslug || '-'}</td>
            <td><span class="source ${sourceClass}">${item.source || '-'}</span></td>
            <td>${item.benchmark_type || item.category || '-'}</td>
            <td class="score">${item.accuracy ? item.accuracy.toFixed(1) + '%' : '-'}</td>
            <td class="score">${item.elo ? item.elo.toFixed(0) : '-'}</td>
            <td class="score">${item.intelligence_index ? item.intelligence_index.toFixed(1) : '-'}</td>
            <td class="score">${item.coding_index ? item.coding_index.toFixed(1) : '-'}</td>
          `;
          tbody.appendChild(row);
        }

        loading.style.display = 'none';
        table.style.display = 'table';
      } catch (err) {
        loading.textContent = 'Error loading benchmarks: ' + err.message;
      }
    }

    loadBenchmarks();
  </script>
</body>
</html>
