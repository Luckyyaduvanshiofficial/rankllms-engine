services:
  - type: web
    name: rankllms-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.rankllms.com,rankllms-engine-kqso.onrender.com,rankllms-engine.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rankllms.com,https://www.rankllms.com,https://api.rankllms.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.rankllms.com,https://rankllms-engine-kqso.onrender.com,https://rankllms-engine.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: ARTIFICIAL_ANALYSIS_API_KEY
        sync: false
      - key: ARTIFICIAL_ANALYSIS_MODELS_PATH
        value: language/models/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      - key: RUN_INITIAL_SYNC
        value: "false"
